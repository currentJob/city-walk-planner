# Local stack with the same shape as production:
#   web  = static front end (as on GitHub Pages) + /api reverse proxy   → http://localhost:8080
#   api  = the Cloudflare Worker + Durable Object, on the workerd runtime → http://localhost:8787
# Start: docker compose up --build        Data: the `api-data` volume (docker compose down -v resets it)
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "8787:8787"
    environment:
      CWP_ALLOWED_ORIGINS: http://localhost:8080
    volumes:
      - api-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 60s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
