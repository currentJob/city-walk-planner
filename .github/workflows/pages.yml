# 화면(정적 자산)만 GitHub Pages 로 배포한다.
#
# 백엔드는 Cloudflare Worker(`worker/`, FastAPI + Durable Object SQLite)에서 돈다 — PC 가 꺼져도 동작한다.
# 여기서 올리는 것은 `src/city_walk_planner/web` 그대로이고, 기본 서버 주소만 `config.js` 에 굽는다.
# 화면에는 주소를 바꾸는 칸이 없다 — 서버 주소는 이 빌드 설정으로만 정한다.
#
# 기본값은 Cloudflare Worker 주소다. 저장소 변수 `CWP_API_BASE` 를 설정하면 그 주소로 바꿔 굽는다(선택).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 실행은 최신 것만 남긴다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: 정적 자산 수집
        shell: bash
        env:
          # 기본 백엔드는 Cloudflare Worker(worker/). 옛 HL_API_BASE 는 임시 터널 주소라 더 읽지 않는다.
          CWP_API_BASE: ${{ vars.CWP_API_BASE || 'https://city-walk-planner-api.currentjob.workers.dev' }}
          # 영수증 인식: 작성자의 OCR 프로젝트가 배포한 모듈(브라우저에서만 실행). 비우면 기능이 숨는다.
          CWP_OCR_MODULE: ${{ vars.CWP_OCR_MODULE || 'https://currentjob.github.io/ocr-llm-page/lib/korean-ocr.mjs' }}
        run: |
          set -euo pipefail
          cp -r src/city_walk_planner/web _site
          # Jekyll 이 밑줄로 시작하는 경로를 삼키지 않게 한다.
          touch _site/.nojekyll
          # 서버 주소는 비워 두는 것이 기본이다. 비어 있으면 화면이 먼저 물어본다.
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlsplit
          base = os.environ.get('CWP_API_BASE', '').rstrip('/')
          if base:
              url = urlsplit(base)
              if url.scheme != 'https' or not url.hostname or url.username or url.password or url.path or url.query or url.fragment:
                  raise SystemExit('CWP_API_BASE must be an HTTPS origin')
          ocr = os.environ.get('CWP_OCR_MODULE', '')
          if ocr and (urlsplit(ocr).scheme != 'https' or not ocr.endswith('.mjs')):
              raise SystemExit('CWP_OCR_MODULE must be an HTTPS .mjs URL')
          Path('_site/config.js').write_text('window.CWP_CONFIG = Object.freeze(' + json.dumps({'apiBase': base, 'ocrModule': ocr}) + ');\n')
          PY

      - name: 배포 버전별 정적 자산 캐시 갱신
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ['GITHUB_SHA']
          relative_asset = re.compile(r"""(["'])(\.\.?/[^"'?#\s]+\.(?:js|css|json))\1""")
          for path in pathlib.Path('_site').rglob('*'):
              if path.suffix not in {'.html', '.js', '.css'} or 'vendor' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              text = relative_asset.sub(lambda m: m[1] + m[2] + '?v=' + version + m[1], text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: 외부 도메인 참조 재확인
        # AC-042 는 저장소에서 검사하지만, **배포되는 물건**에서 한 번 더 본다.
        # 배포 산출물이 검사 대상과 다르면 검사는 자기 자신을 검사한 것이다.
        #
        # 범위는 저장소 검사(tests/static/test_frontend_assets.py)와 같게 둔다 —
        # 우리 소스(html · css · js)만 보고 `vendor/` 는 제외한다. 벤더 파일은
        # MANIFEST.sha256 이 따로 지키며, 라이브러리 배너 주석의 홈페이지 URL은
        # 요청을 유발하지 않는다.
        #
        # **허용 목록을 여기에 적지 않는다.** 그 테스트의 `ALLOWED_RUNTIME_HOSTS` 를
        # 읽어 쓴다 — 목록을 두 곳에 두었다가 두 번 갈라졌다(Leaflet 배너, 그다음
        # OpenRice 링크). 갈라지면 한쪽은 반드시 거짓말을 하고, 그 거짓말이 배포를
        # 막거나 그냥 통과시킨다.
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, sys

          test = pathlib.Path("tests/static/test_frontend_assets.py").read_text(encoding="utf-8")
          block = re.search(r"ALLOWED_RUNTIME_HOSTS\s*=\s*\{(.*?)\n\}", test, re.S).group(1)
          allowed = set(re.findall(r'"([^"]+)"', block))
          if not allowed:
              print("허용 목록을 읽지 못했다 — 검사가 무의미해진다", file=sys.stderr)
              sys.exit(1)
          print("허용 호스트(테스트에서 읽음):", sorted(allowed))

          url = re.compile(r"""https?://([^\s"'`)\\<>]+)""")
          offenders = []
          for path in sorted(pathlib.Path("_site").rglob("*")):
              if path.suffix not in {".html", ".css", ".js"} or "vendor" in path.parts:
                  continue
              if path.name == "config.js":   # 배포 시 주입되는 백엔드 주소
                  continue
              for match in url.finditer(path.read_text(encoding="utf-8", errors="replace")):
                  host = match.group(1).split("/")[0]
                  if host not in allowed:
                      offenders.append(f"{path}: {host}")
          if offenders:
              print("배포 산출물에 예상 밖 외부 도메인이 있다:", *offenders, sep="\n  ", file=sys.stderr)
              sys.exit(1)
          print("외부 도메인 참조: 허용 목록 안에만 있음 (vendor 는 MANIFEST.sha256 이 검증)")
          PY

      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4.0.5
