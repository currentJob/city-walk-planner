# Build the self-host image (docker/app.Dockerfile) and publish it to GitHub Container Registry.
#
#   ghcr.io/<owner>/city-walk-planner:latest   — every push to main
#   ghcr.io/<owner>/city-walk-planner:<sha>    — the exact commit
#   ghcr.io/<owner>/city-walk-planner:vX.Y.Z   — release tags
#
# The first publish creates a *private* package; make it public once in
# GitHub → Packages → city-walk-planner → Package settings, so others can pull without logging in.
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 이미지 이름과 태그
        id: meta
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then tags="${tags},${image}:latest"; fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tags="${tags},${image}:${GITHUB_REF_NAME}"; fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=City Walk Planner — self-hosted FastAPI + SQLite
          cache-from: type=gha
          cache-to: type=gha,mode=max
