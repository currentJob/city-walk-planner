<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>내 여행 · City Walk Planner</title><link rel="stylesheet" href="/account/assets/account.css"></head><body><header><a href="/account/" class="brand">CITY WALK / PRIVATE</a><span id="identity"></span></header><main><section class="intro"><p class="eyebrow">나만의 여행수첩</p><h1>여행의 모든 순간,<br>내 계정에 안전하게.</h1><p>일정·준비물·메모를 휴대폰과 PC에서 이어서 관리하세요.</p></section><p id="status" role="status" aria-live="polite">로그인 상태 확인 중…</p><section id="login" hidden><a class="button" href="/auth/github/start">GitHub 계정으로 로그인</a><p>운영자가 허용한 계정만 사용할 수 있습니다. 저장소 접근 권한은 요청하지 않습니다.</p></section><section id="workspace" hidden><div class="toolbar"><label class="button">일정 파일 가져오기<input id="import" type="file" accept="application/json,.json"></label><button id="export">백업 다운로드</button><button id="print">인쇄 / PDF</button><button id="logout">로그아웃</button></div><p class="muted">다운로드한 백업·PDF는 이 기기에 남습니다. 개인 기기에서 보관하세요.</p><div id="empty" hidden><h2>여행수첩을 가져오세요</h2><p>보존한 개인 일정 JSON 파일을 선택하면 내 계정에 저장됩니다.</p></div><section id="notebook" hidden><h2 id="title"></h2><p id="summary"></p><section class="card"><h2>여행 설정</h2><label id="variantLabel" for="variant">방문일 계획</label><select id="variant"></select><label for="flightTime">귀국편 출발 시각 (홍콩 현지)</label><input id="flightTime" type="time"><p id="airportTiming"></p><label for="hotel">숙소 이름·주소</label><input id="hotel" maxlength="200" placeholder="호텔 검색에 사용할 주소"><p id="hotelMap"></p><button id="saveSettings">설정 저장</button></section><nav id="dayNav" aria-label="날짜 바로가기"></nav><div id="days"></div><section class="card"><h2>출발 전 체크리스트 <small id="progress"></small></h2><div id="checklist"></div></section><section class="card"><h2>나만의 메모</h2><label for="notes">항공편·숙소·예약 확인 사항</label><textarea id="notes" rows="5" maxlength="12000" placeholder="항공편 시각, 호텔 주소 등을 적어 두세요."></textarea><button id="saveNotes">메모 저장</button></section><section class="card"><h2>놀거리 찾아보기</h2><input id="search" type="search" placeholder="지역·이름·취향 검색" aria-label="놀거리 검색"><div id="activities"></div></section><div id="extras"></div></section></section></main><script type="module" src="/account/assets/account.js"></script></body></html>
